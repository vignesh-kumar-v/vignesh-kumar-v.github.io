<!DOCTYPE html>
<!-- Source for og.png. Regenerate with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
       --screenshot=assets/img/og.png --window-size=1200,630 --hide-scrollbars \
       --default-background-color=00000000 assets/img/og-source.html            -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#0a0b0d;
       font-family:'Space Grotesk',system-ui,sans-serif;color:#e9ecf3;position:relative}
  .glow{position:absolute;width:900px;height:900px;border-radius:50%;top:-420px;right:-260px;
        background:radial-gradient(circle,rgba(91,140,255,.30),transparent 62%);filter:blur(30px)}
  .glow2{position:absolute;width:620px;height:620px;border-radius:50%;bottom:-360px;left:-180px;
         background:radial-gradient(circle,rgba(0,217,165,.16),transparent 65%);filter:blur(30px)}
  svg.net{position:absolute;inset:0;width:1200px;height:630px;opacity:.5}
  .pad{position:relative;padding:64px 72px;height:100%;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:14px}
  .mark{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:700;
        font-size:22px;color:#fff;background:linear-gradient(135deg,#5b8cff,#c084fc);
        box-shadow:0 6px 22px -6px rgba(91,140,255,.7)}
  .who{font-size:21px;font-weight:600;letter-spacing:-.01em}
  .where{font-family:'JetBrains Mono',monospace;font-size:13px;color:#6f7788;margin-top:2px}
  h1{margin-top:auto;font-size:76px;line-height:.98;letter-spacing:-.042em;font-weight:600}
  h1 em{font-style:normal;background:linear-gradient(100deg,#5b8cff,#c084fc 52%,#00d9a5);
        -webkit-background-clip:text;background-clip:text;color:transparent}
  .lede{margin-top:22px;font-size:22px;color:#a8b0c0;letter-spacing:-.012em;max-width:22ch}
  .rule{margin-top:34px;height:1px;background:linear-gradient(90deg,#22262f,transparent)}
  .foot{margin-top:26px;display:flex;align-items:center;gap:34px}
  .stat b{display:block;font-size:26px;font-weight:600;letter-spacing:-.03em;color:#5b8cff}
  .stat span{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#6f7788;letter-spacing:.03em}
  .url{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:15px;color:#a8b0c0;
       border:1px solid #22262f;padding:11px 18px;border-radius:11px;background:#121419}
</style>
</head>
<body>
<div class="glow"></div><div class="glow2"></div>
<svg class="net" id="net"></svg>
<div class="pad">
  <div class="top">
    <div class="mark">V</div>
    <div>
      <div class="who">Vigneshkumar Venugopal</div>
      <div class="where">MS Data Science · Arizona State University</div>
    </div>
  </div>

  <h1>ML systems<br>at <em>the metal</em>.</h1>
  <p class="lede">CUDA kernels, quantized LLMs, agentic architectures, production MLOps.</p>

  <div class="rule"></div>
  <div class="foot">
    <div class="stat"><b>1.7&times;</b><span>FUSED CUDA KERNEL</span></div>
    <div class="stat"><b>~175</b><span>TOK/S ON MLX</span></div>
    <div class="stat"><b>0.9998</b><span>COSINE PARITY</span></div>
    <div class="stat"><b>2</b><span>ELSEVIER PAPERS</span></div>
    <div class="url">vignesh-kumar-v.github.io</div>
  </div>
</div>

<script>
  // static node graph, seeded so the card renders identically every time
  var seed = 20260822;
  function rnd(){ seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  var W = 1200, H = 630, N = [], svg = document.getElementById('net'), out = '';
  for (var i = 0; i < 62; i++) N.push({ x: rnd() * W, y: rnd() * H, r: rnd() * 1.9 + 1 });
  for (var a = 0; a < N.length; a++) {
    for (var b = a + 1; b < N.length; b++) {
      var dx = N[a].x - N[b].x, dy = N[a].y - N[b].y, d = Math.sqrt(dx * dx + dy * dy);
      if (d < 165) {
        out += '<line x1="' + N[a].x.toFixed(1) + '" y1="' + N[a].y.toFixed(1) +
               '" x2="' + N[b].x.toFixed(1) + '" y2="' + N[b].y.toFixed(1) +
               '" stroke="rgba(91,140,255,' + ((1 - d / 165) * 0.30).toFixed(3) +
               ')" stroke-width="0.8"/>';
      }
    }
  }
  N.forEach(function (n) {
    out += '<circle cx="' + n.x.toFixed(1) + '" cy="' + n.y.toFixed(1) + '" r="' + n.r.toFixed(2) +
           '" fill="rgba(140,175,255,0.55)"/>';
  });
  svg.innerHTML = out;
</script>
</body>
</html>
